[package]
name = "hcrypt-primitives"
version = "0.1.0"
edition = "2024"

[dependencies]
rand = "0.8.5"
hkdf = "0.12.4"
sha2 = "0.10.8"
subtle = "2.6.1"
rand_core = "0.6.4"
argon2 = "0.5.3"
aes-gcm = "0.10.3"
ed25519-dalek = "2.1.1"
curve25519-dalek = "4.1.3"
x25519-dalek = {version="2.0.1", features=["reusable_secrets", "static_secrets", "serde"] }
serde = { version = "1.0.219", features = ["derive"] }
zeroize = { version = "1.8.1", features = ["derive"] }


serde_with = "3.12.0"
rmp-serde = "1.3.0"
error_set = "0.9.1"



