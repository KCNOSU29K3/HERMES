[package]
name = "hcrypt"
version = "0.1.0"
edition = "2024"

[dependencies]
rand = "0.8.5"
rand_core = "0.6.4"
zeroize = { version = "1.8.1", features = ["derive"] }
hcrypt-primitives = {path = "./hcrypt-primitives"}
hcrypt-derive = {path = "../hcrypt-derive"}
serde = { version = "1.0.228", features = ["derive"] }
rmp-serde = "1.3.1"

[dev-dependencies]
seahash = "4.1"